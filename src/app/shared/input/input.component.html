<div class="form-group has-feedback" [class.has-success]="hasSuccess()" [class.has-warning]="hasError()">
	@if (hasRequired()) {
		@if (labelInput().length) {
			<label class="{{getClass()}} control-label" for="" innerHtml="{{labelInput()}} <i class='fas fa-asterisk obrigatorio' ></i>">
		</label>
	}
} @else {
	@if (labelInput().length) {
		<label  class="{{getClass()}} control-label" for="" [innerHtml]="labelInput()"> </label>
	}
}
<!-- {{labelInput()}}  -->
<ng-content></ng-content>
@if (hasError()) {
	<label class="control-label control-error" for="inputSuccess">
		<!-- <span *ngIf="showTip && hasSuccess()"><i class="fa fa-check"></i>Ok</span> -->
		@if (showTip && hasError()) {
			<span><i class="fa fa-remove"></i> {{errorMessage}}</span>
		}
	</label>
}
</div>
